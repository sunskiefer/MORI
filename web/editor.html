<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MORI Editor</title>
<style>
:root{--bg:#0b0b0a;--pn:#151513;--ln:#3a3427;--gold:#dcbd85;--ink:#efe9dc;--dim:#9a927f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 "Titillium Web",system-ui,Segoe UI,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:#000;border-bottom:1px solid var(--ln);padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
h1{font-size:26px;margin:0;letter-spacing:.12em}h2{font-size:15px;letter-spacing:.2em;color:var(--gold);margin:0 0 10px;text-transform:uppercase}
.st{color:var(--dim);font-size:14px}.live{color:var(--gold);font-weight:700}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--ln)}
button,select,input[type=text]{background:#1c1b18;color:var(--ink);border:1px solid var(--ln);border-radius:8px;padding:8px 12px;font:inherit}
button{cursor:pointer}button:hover,button.on{border-color:var(--gold);color:var(--gold)}
main{padding:16px;display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:14px}
.card.wide{grid-column:1/-1}
.row{display:grid;grid-template-columns:110px 1fr 74px;gap:8px;align-items:center;margin:6px 0}
.row label{color:var(--dim);font-size:13px;letter-spacing:.06em}.row output{text-align:right;color:var(--gold);font-variant-numeric:tabular-nums;font-size:14px}
input[type=range]{width:100%;accent-color:var(--gold)}select{width:100%;padding:5px 8px}
canvas{width:100%;height:170px;background:#0a0a09;border:1px solid var(--ln);border-radius:8px;touch-action:none}
.types{display:grid;grid-template-columns:repeat(16,1fr);gap:2px;margin-top:6px}.types select{padding:2px 0;font-size:11px;text-align:center}
.pl{max-height:340px;overflow:auto;border:1px solid var(--ln);border-radius:8px}
.pl div{padding:7px 10px;cursor:pointer;border-bottom:1px solid #22201a;display:flex;justify-content:space-between}
.pl div:hover{background:#1d1c18}.pl div.sel{background:#2a2518;color:var(--gold)}.pl small{color:var(--dim)}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.hide{display:none}
#pad{height:120px}
</style></head><body>
<header><h1>MORI</h1><span class="st">editor</span><span id="conn" class="st">connecting</span><span id="pname" class="live"></span><span id="info" class="st"></span></header>
<nav id="nav"></nav><main id="main"></main>
<script>
let META=null,ST=null,held={},tab='PLAY';
const $=(s,p=document)=>p.querySelector(s),el=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){if(k=='class')e.className=a[k];else if(k.startsWith('on'))e[k]=a[k];else e.setAttribute(k,a[k])}c.forEach(x=>e.append(x));return e};
const get=u=>fetch(u,{cache:'no-store'}).then(r=>r.json());
const idx=k=>META.keys[k];
function send(i,v){fetch('/set?i='+i+'&v='+v,{cache:'no-store'});if(ST)ST.v[i]=+v}
function fmt(p,v){return p.o?p.o[Math.round(v)]:(Math.abs(p.max-p.min)<=20&&!p.int?(+v).toFixed(2):Math.round(v))+(p.u?' '+p.u:'')}
const TABS={PLAY:['LEVELS','FILTER','DUB','MASTER FX'],DELAY:['DELAY'],REVERB:['REVERB'],TEXTURE:['TEXTURE','FRAGMENT'],ROUTING:['ROUTING','FLOW'],SOUND:['SOUND'],'SEQ 1':['SEQ 1','SEQ 1 GATES'],'SEQ 2':['SEQ 2','SEQ 2 GATES'],TOUCH:['TOUCH'],PRESETS:[]};
function ctl(p){const i=p.i;if(p.trig)return el('div',{class:'row'},el('label',{},p.n),el('button',{onclick:()=>{send(i,1);setTimeout(()=>send(i,0),120)}},p.n),el('output'));
 let inp;if(p.o){inp=el('select',{'data-i':i});p.o.forEach((o,n)=>inp.append(el('option',{value:n},o)));inp.onchange=()=>send(i,inp.value)}
 else{inp=el('input',{type:'range',min:p.min,max:p.max,step:(p.int||p.max-p.min>20)?1:0.01,'data-i':i});inp.oninput=()=>{held[i]=Date.now();send(i,inp.value);inp.parentNode.lastChild.textContent=fmt(p,inp.value)}}
 return el('div',{class:'row'},el('label',{},p.n),inp,el('output',{'data-o':i}))}
function seqCard(n){const c=el('div',{class:'card wide'},el('h2',{},'SEQ '+n+' steps'));const cv=el('canvas',{'data-seq':n});c.append(cv);
 const ty=el('div',{class:'types'});for(let s=1;s<=16;s++){const p=META.p[idx('t'+n+'_'+s)],se=el('select',{'data-i':p.i});p.o.forEach((o,k)=>se.append(el('option',{value:k},o)));se.onchange=()=>send(p.i,se.value);ty.append(se)}c.append(ty);
 const b=el('div',{class:'bar'});b.append(el('span',{class:'st'},'Pattern slots:'));for(let s=0;s<8;s++){b.append(el('button',{onclick:()=>cmd('patload&slot='+s+'&seq='+n)},'Load '+(s+1)),el('button',{onclick:()=>cmd('patsave&slot='+s+'&seq='+n)},'Save '+(s+1)))}c.append(b);
 const draw=e=>{const r=cv.getBoundingClientRect(),s=Math.min(15,Math.max(0,Math.floor((e.clientX-r.left)/r.width*16))),v=Math.round(100*(1-Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))));const i=idx('s'+n+'_'+(s+1));held[i]=Date.now();send(i,v);paint()};
 cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);cv.dr=1;draw(e)};cv.onpointermove=e=>{if(cv.dr)draw(e)};cv.onpointerup=()=>cv.dr=0;return c}
function paint(){document.querySelectorAll('canvas[data-seq]').forEach(cv=>{const n=cv.dataset.seq,w=cv.width=cv.clientWidth,h=cv.height=cv.clientHeight,g=cv.getContext('2d');g.clearRect(0,0,w,h);const len=ST.v[idx('sq'+n+'_len')];
 for(let s=0;s<16;s++){const v=ST.v[idx('s'+n+'_'+(s+1))]/100,x=s*w/16;g.fillStyle=s<len?'#dcbd85':'#5a5140';g.fillRect(x+3,h-v*(h-4)-2,w/16-6,v*(h-4));g.strokeStyle='#3a3427';g.strokeRect(x+.5,.5,w/16-1,h-1)}});
 const pd=$('#pad');if(pd){const w=pd.width=pd.clientWidth,h=pd.height=pd.clientHeight,g=pd.getContext('2d');g.clearRect(0,0,w,h);g.strokeStyle='#dcbd85';for(let z=0;z<3;z++)g.strokeRect(z*w/3+2,2,w/3-4,h-4);
  const x=(ST.v[idx('tch_x')]+5)/10*w,y=(1-(ST.v[idx('tch_y')]+5)/10)*h;g.fillStyle=ST.touch?'#fff':'#dcbd85';g.beginPath();g.arc(x,y,9,0,7);g.fill()}}
function build(){const m=$('#main');m.innerHTML='';const nv=$('#nav');nv.innerHTML='';Object.keys(TABS).forEach(t=>nv.append(el('button',{class:t==tab?'on':'',onclick:()=>{tab=t;build()}},t)));
 if(tab=='PRESETS'){presetsCard(m);return}
 TABS[tab].forEach(sn=>{const s=META.secs.find(x=>x.label==sn);if(!s)return;const c=el('div',{class:'card'},el('h2',{},sn));
  s.keys.forEach(k=>{const p=META.p[idx(k)];if(!p||p.str||/^s\d_\d+$/.test(k)||/^t\d_\d+$/.test(k))return;if(sn=='TOUCH'&&/^tz\d_/.test(k)){const z=k[2];if(!c.z||c.z!=z){c.z=z;c.append(el('h2',{style:'margin-top:12px'},'Zone '+z))}}c.append(ctl(p))});m.append(c)});
 if(tab=='SEQ 1')m.append(seqCard(1));if(tab=='SEQ 2')m.append(seqCard(2));
 if(tab=='TOUCH'){const c=el('div',{class:'card wide'},el('h2',{},'Touch bar'));const pd=el('canvas',{id:'pad'});c.append(pd);
  const mv=e=>{const r=pd.getBoundingClientRect();send(idx('tch_x'),((e.clientX-r.left)/r.width*10-5).toFixed(2));send(idx('tch_y'),(5-(e.clientY-r.top)/r.height*10).toFixed(2))};
  pd.onpointerdown=e=>{pd.setPointerCapture(e.pointerId);pd.dr=1;mv(e)};pd.onpointermove=e=>{if(pd.dr)mv(e)};pd.onpointerup=()=>pd.dr=0;m.prepend(c)}
 refresh()}
let PL=null,psel=-1;
function presetsCard(m){const c=el('div',{class:'card wide'},el('h2',{},'Presets'));const nm=el('input',{type:'text',placeholder:'name for a new or renamed preset',maxlength:24,style:'flex:1;min-width:220px'});
 const b=el('div',{class:'bar'},nm,el('button',{onclick:()=>cmd('save&name='+encodeURIComponent(nm.value||'')).then(loadPL)},'Save new'),el('button',{onclick:()=>cmd('over').then(loadPL)},'Overwrite selected'),
  el('button',{onclick:()=>cmd('rename&name='+encodeURIComponent(nm.value)).then(loadPL)},'Rename selected'),el('button',{onclick:()=>{if(confirm('Delete the selected user preset?'))cmd('del').then(loadPL)}},'Delete selected'),
  el('button',{onclick:()=>location.href='/export'},'Export my presets'),el('button',{onclick:()=>fi.click()},'Import presets'));
 const fi=el('input',{type:'file',class:'hide'});fi.onchange=()=>{const f=fi.files[0];if(f)f.text().then(t=>fetch('/import',{method:'POST',body:t})).then(loadPL)};
 c.append(b,fi,el('div',{class:'pl',id:'pl'}),el('p',{class:'st'},'Factory presets cannot be overwritten, renamed or deleted. Export saves your own presets as a text file; Import adds presets from such a file.'));m.append(c);loadPL()}
function loadPL(){return get('/presets').then(d=>{PL=d;drawPL()})}
function drawPL(){const p=$('#pl');if(!p||!PL)return;p.innerHTML='';PL.f.concat(PL.u).forEach((n,i)=>p.append(el('div',{class:ST&&ST.sel==i?'sel':'',onclick:()=>cmd('load&n='+i)},el('span',{},(i+1)+'  '+n),el('small',{},i<PL.f.length?'factory':'user'))))}
function cmd(c){return fetch('/cmd?c='+c,{cache:'no-store'})}
function refresh(){if(!ST)return;const now=Date.now();document.querySelectorAll('[data-i]').forEach(e=>{const i=+e.dataset.i;if(held[i]&&now-held[i]<600)return;if(document.activeElement===e&&e.tagName=='INPUT')return;const v=ST.v[i];if(e.value!=v)e.value=e.tagName=='SELECT'?Math.round(v):v});
 document.querySelectorAll('[data-o]').forEach(o=>{const p=META.p[+o.dataset.o];o.textContent=fmt(p,ST.v[p.i])});$('#pname').textContent=ST.name;$('#info').textContent=ST.info;paint();if(ST.sel!==psel){psel=ST.sel;drawPL()}}
function poll(){get('/state').then(s=>{const first=!ST;ST=s;$('#conn').textContent='live';$('#conn').className='live';first?build():refresh()}).catch(()=>{$('#conn').textContent='not connected';$('#conn').className='st'}).finally(()=>setTimeout(poll,200))}
get('/meta').then(m=>{META=m;META.keys={};m.p.forEach(p=>META.keys[p.k]=p.i);poll()});
</script></body></html>
